name: Setup orun
description: Install orun and add it to PATH

inputs:
  version:
    description: orun version to install. Accepts a full tag (v1.12.4) or "latest".
    default: latest
  install-dir:
    description: Directory to install the binary into.
    default: ~/.local/bin
  install-url:
    description: Override the install script URL (air-gapped environments).
    default: https://raw.githubusercontent.com/sourceplane/orun/main/install.sh

outputs:
  version:
    description: Resolved orun version string (e.g. v1.12.4).
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve version
      id: version
      shell: bash
      run: |
        echo "::group::Resolve orun version"
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
          VERSION=$(curl -fsSL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sourceplane/orun/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "Resolved latest → $VERSION"
        fi
        echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"

    - name: Resolve install dir
      id: dirs
      shell: bash
      run: |
        INSTALL_DIR=$(echo "${{ inputs.install-dir }}" | sed "s|^~|$HOME|")
        mkdir -p "$INSTALL_DIR"
        echo "path=$INSTALL_DIR" >> "$GITHUB_OUTPUT"

    - name: Restore cached binary
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.dirs.outputs.path }}/orun
        key: orun-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.tag }}

    - name: Install orun
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ORUN_VERSION: ${{ steps.version.outputs.tag }}
        ORUN_INSTALL_DIR: ${{ steps.dirs.outputs.path }}
      run: |
        echo "::group::Install orun ${{ steps.version.outputs.tag }}"
        curl -fsSL "${{ inputs.install-url }}" | sh
        echo "::endgroup::"

    - name: Add to PATH
      shell: bash
      run: echo "${{ steps.dirs.outputs.path }}" >> "$GITHUB_PATH"

    - name: Verify installation
      id: resolve
      shell: bash
      run: |
        echo "::group::Verify orun"
        ORUN_BIN="${{ steps.dirs.outputs.path }}/orun"
        if [ ! -x "$ORUN_BIN" ]; then
          echo "::error::orun installation failed — binary not found at $ORUN_BIN"
          exit 1
        fi
        INSTALLED_VERSION=$("$ORUN_BIN" version 2>/dev/null || echo "")
        if [ -z "$INSTALLED_VERSION" ]; then
          echo "::error::orun binary exists but failed to report version"
          exit 1
        fi
        echo "version=$INSTALLED_VERSION" >> "$GITHUB_OUTPUT"
        echo "::notice::orun $INSTALLED_VERSION ready"
        echo "::endgroup::"
