name: orun run
description: Execute a job from a compiled plan

inputs:
  version:
    description: orun version.
    default: latest
  plan:
    description: Path to plan.json or artifact name to download.
    required: true
  job:
    description: Job ID to execute. Omit to run all jobs sequentially.
    default: ""
  runner:
    description: Execution backend — local, github-actions, or docker.
    default: github-actions
  workdir:
    description: Working directory for all job steps.
    default: ${{ github.workspace }}
  remote-state:
    description: Enable remote state for distributed dependency coordination.
    default: "false"
  backend-url:
    description: orun backend URL when remote-state is true.
    default: ""
  exec-id:
    description: Execution ID. Set to a stable value (e.g. the run ID) for resume support.
    default: ${{ github.run_id }}-${{ github.run_attempt }}
  dry-run:
    description: Print execution plan without running steps.
    default: "false"
  download-artifact:
    description: Download plan from a workflow artifact instead of a local path.
    default: "false"
  artifact-name:
    description: Artifact name to download when download-artifact is true.
    default: orun-plan

outputs:
  exec-id:
    description: Execution ID assigned to this run.
    value: ${{ steps.run.outputs.exec-id }}
  status:
    description: Terminal status — success, failure, or partial.
    value: ${{ steps.run.outputs.status }}

runs:
  using: composite
  steps:
    - uses: sourceplane/orun-action@v1
      with:
        version: ${{ inputs.version }}

    - name: Download plan artifact
      if: inputs.download-artifact == 'true'
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}

    - name: Execute
      id: run
      shell: bash
      env:
        ORUN_BACKEND_URL: ${{ inputs.backend-url }}
      run: |
        set -euo pipefail

        JOB_LABEL="${{ inputs.job }}"
        [ -z "$JOB_LABEL" ] && JOB_LABEL="all (sequential)"
        echo "::group::Execute job: $JOB_LABEL"

        FLAGS=""
        [ -n "${{ inputs.job }}" ]                    && FLAGS="$FLAGS --job ${{ inputs.job }}"
        [ "${{ inputs.remote-state }}" = "true" ]     && FLAGS="$FLAGS --remote-state"
        [ "${{ inputs.dry-run }}" = "true" ]          && FLAGS="$FLAGS --dry-run"

        echo "Plan:         ${{ inputs.plan }}"
        echo "Runner:       ${{ inputs.runner }}"
        echo "Exec ID:      ${{ inputs.exec-id }}"
        echo "Remote state: ${{ inputs.remote-state }}"
        echo "Dry run:      ${{ inputs.dry-run }}"
        echo "---"

        EXEC_STATUS=0
        orun run \
          --plan "${{ inputs.plan }}" \
          --runner "${{ inputs.runner }}" \
          --workdir "${{ inputs.workdir }}" \
          --exec-id "${{ inputs.exec-id }}" \
          $FLAGS || EXEC_STATUS=$?

        echo "::endgroup::"

        echo "exec-id=${{ inputs.exec-id }}" >> "$GITHUB_OUTPUT"

        if [ $EXEC_STATUS -eq 0 ]; then
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "::notice::Job $JOB_LABEL completed successfully"
          {
            echo "### Job executed: \`$JOB_LABEL\`"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Status | :white_check_mark: success |"
            echo "| Exec ID | \`${{ inputs.exec-id }}\` |"
            echo "| Runner | ${{ inputs.runner }} |"
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "status=failure" >> "$GITHUB_OUTPUT"
          echo "::error::Job $JOB_LABEL failed with exit code $EXEC_STATUS"
          {
            echo "### Job executed: \`$JOB_LABEL\`"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Status | :x: failure (exit $EXEC_STATUS) |"
            echo "| Exec ID | \`${{ inputs.exec-id }}\` |"
            echo "| Runner | ${{ inputs.runner }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $EXEC_STATUS
        fi
